<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Active Directory Attacks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d353"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="2" y="2" width="996" height="216" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="995" height="215" rx="13.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- faint grid -->
  <g stroke="#1b2129" stroke-width="1" opacity="0.6">
    <line x1="0" y1="55" x2="1000" y2="55"/>
    <line x1="0" y1="110" x2="1000" y2="110"/>
    <line x1="0" y1="165" x2="1000" y2="165"/>
  </g>

  <!-- terminal window dots -->
  <circle cx="34" cy="32" r="6" fill="#f85149"/>
  <circle cx="56" cy="32" r="6" fill="#d29922"/>
  <circle cx="78" cy="32" r="6" fill="#39d353"/>
  <text x="104" y="37" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" fill="#6e7681">aswan@kali: ~/AD</text>

  <!-- title -->
  <text x="40" y="118" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="42" font-weight="700" fill="url(#accent)" letter-spacing="1">ACTIVE DIRECTORY ATTACKS</text>

  <!-- animated underline sweep -->
  <rect x="40" y="132" width="640" height="3" rx="1.5" fill="#21262d"/>
  <rect x="40" y="132" width="200" height="3" rx="1.5" fill="url(#sweep)">
    <animate attributeName="x" values="40;480;40" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="40" y="162" font-family="'SFMono-Regular', Consolas, monospace" font-size="14.5" fill="#8b949e">Offensive AD tradecraft, lab-verified &#8212; from one mistyped hostname to domain compromise</text>

  <!-- prompt line with blinking cursor -->
  <text x="40" y="192" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" fill="#7d8590"><tspan fill="#39d353">root@dc01</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#6e7681"># </tspan><tspan fill="#c9d1d9">whoami /priv  &#8594;  SeDebugPrivilege</tspan></text>
  <rect x="397" y="181" width="8" height="14" fill="#39d353">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- attack-graph motif, right -->
  <g stroke="#2d333b" stroke-width="1.5">
    <line x1="860" y1="60" x2="930" y2="48"/>
    <line x1="860" y1="60" x2="915" y2="105"/>
    <line x1="860" y1="60" x2="880" y2="150"/>
    <line x1="915" y1="105" x2="955" y2="128"/>
    <line x1="915" y1="105" x2="930" y2="48"/>
    <line x1="880" y1="150" x2="915" y2="105"/>
  </g>
  <circle cx="930" cy="48" r="4.5" fill="#58a6ff"/>
  <circle cx="915" cy="105" r="4.5" fill="#58a6ff"/>
  <circle cx="880" cy="150" r="4.5" fill="#58a6ff"/>
  <circle cx="955" cy="128" r="4.5" fill="#bc8cff"/>
  <!-- compromised root node, pulsing -->
  <circle cx="860" cy="60" r="7" fill="#f85149">
    <animate attributeName="r" values="7;10;7" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
